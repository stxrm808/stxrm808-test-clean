<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'BC';font-weight:300;src:url(node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-300-normal.woff2)}
@font-face{font-family:'BC';font-weight:400;src:url(node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-400-normal.woff2)}
@font-face{font-family:'BC';font-weight:500;src:url(node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-500-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// AURA ad, idea B "THE CHAIN" — v03: AURA's own look (black, white light, chrome), real renders.
const W=1920,H=1080,FPS=60,DUR=20.2;
const WHITE='#f2f2f0', GREY='#9a9a98', DIM='#5c5c5a';
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const out=cv.getContext('2d');
const off=new OffscreenCanvas(W,H),ctx=off.getContext('2d');

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>x>=1?1:1-Math.pow(2,-10*x);
const eIn=x=>x<=0?0:Math.pow(2,10*x-10);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

// ---------- images ----------
const IMG={};const names=['01','03','04','05','06','07','08','09','10','11'];
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})}
const SMALL={}; // tiny copies for cheap defocus
async function loadAll(){
  for(const n of names){IMG[n]=await load(`img/AURA-IMG-${n}.png`);}
  IMG.top=await load('img/AURA-TOPVIEW.jpg');
  for(const k in IMG){const s=new OffscreenCanvas(160,160*IMG[k].height/IMG[k].width);s.getContext('2d').drawImage(IMG[k],0,0,s.width,s.height);SMALL[k]=s;}
  // logos → white, AURA logo split into its 4 rows
  const white=async(src)=>{const i=await load(src);const c=new OffscreenCanvas(i.width,i.height),x=c.getContext('2d');x.drawImage(i,0,0);x.globalCompositeOperation='source-in';x.fillStyle=WHITE;x.fillRect(0,0,i.width,i.height);return c};
  IMG.logo=await white('img/AURA-LOGO-II.png');IMG.dna=await white('img/DNA-LOGO.png');
}
// draw a still with a slow camera: cover-fit, centre (cx,cy in source px), zoom, pan, defocus 0..1, brightness
function shot(key,t,t0,t1,o){
  const img=IMG[key],p=clamp((t-t0)/(t1-t0));
  const z=lerp(o.z0||1,o.z1||1.06,p), cx=lerp(o.cx0,o.cx1??o.cx0,p), cy=lerp(o.cy0,o.cy1??o.cy0,p);
  const sc=Math.max(W/img.width,H/img.height)*z, dw=img.width*sc, dh=img.height*sc;
  let x=W/2-cx*sc, y=H/2-cy*sc; x=clamp(x,W-dw,0); y=clamp(y,H-dh,0);
  const dx=(o.dx||0), f=o.focus??0;
  ctx.save();ctx.globalAlpha=o.alpha??1;
  if(o.bright!=null)ctx.filter=`brightness(${o.bright})`;
  if(f<1)ctx.drawImage(img,x+dx,y,dw,dh);
  if(f>0){ctx.globalAlpha=(o.alpha??1)*clamp(f*1.4);ctx.imageSmoothingQuality='high';ctx.drawImage(SMALL[key],x+dx,y,dw,dh);}
  ctx.restore();
}
// kinetic type: tracking settles, rises from a mask line (no glow, no colour)
function ktext(str,x,y,size,t,t0,t1,o={}){
  const p=eOut(prog(t,t0,t0+(o.inDur||.6))), q=t1==null?0:eIn(prog(t,t1,t1+(o.outDur||.3)));
  if(p<=0||q>=1)return;
  ctx.save();
  ctx.font=`${o.weight||500} ${size}px BC`;ctx.textAlign=o.align||'center';ctx.textBaseline='alphabetic';
  ctx.letterSpacing=`${lerp(size*(o.trackIn??.35),size*(o.track??.02),p)}px`;
  // mask: text rises out of a line at baseline
  const w=ctx.measureText(str).width+size;const left=o.align==='left'?x-size*.2:x-w/2;
  ctx.beginPath();ctx.rect(left,y-size*1.1-q*size,w,size*1.35);ctx.clip();
  ctx.globalAlpha=(o.alpha??1)*(1-q);ctx.fillStyle=o.color||WHITE;
  ctx.fillText(str,x,y+(1-p)*size*.9-q*size*.9);
  ctx.restore();
}
// thin UI frame that draws itself on (like the boxes around AURA's knobs)
function frame(x,y,w,h,t,t0,t1,o={}){
  const p=eIO(prog(t,t0,t0+(o.dur||.55))), q=t1==null?0:prog(t,t1,t1+.25);
  if(p<=0||q>=1)return;
  const per=2*(w+h), len=per*p;
  ctx.save();ctx.globalAlpha=(o.alpha??1)*(1-q);ctx.strokeStyle=o.color||WHITE;ctx.lineWidth=o.lw||2;
  ctx.beginPath();let rem=len;const pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
  ctx.moveTo(x,y);
  for(let i=1;i<pts.length&&rem>0;i++){const [ax,ay]=pts[i-1],[bx,by]=pts[i],seg=Math.hypot(bx-ax,by-ay),k=Math.min(1,rem/seg);ctx.lineTo(lerp(ax,bx,k),lerp(ay,by,k));rem-=seg;}
  ctx.stroke();
  if(o.tab&&p>.95){ctx.fillStyle=o.color||WHITE;ctx.fillRect(x,y,14,14);} // small corner tab like the UI
  ctx.restore();
}
// white light bar with soft bloom (no colour)
const BAR=(()=>{const c=new OffscreenCanvas(512,64),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,64);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.42,'rgba(255,255,255,.18)');g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(.58,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,512,64);return c})();
function lightBar(x,y,w,th,a){if(a<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.drawImage(BAR,x,y-th*4,w,th*8);ctx.restore();}
// procedural tunnel of light bars (perspective), each switches on with a flicker
function tunnel(t,t0,a=1,cy=H*.18){
  for(let i=0;i<11;i++){
    const d=i/10, y=cy+Math.pow(d,1.6)*H*.32, w=lerp(W*.78,W*.12,Math.pow(d,.7)), th=lerp(3.2,1.2,d);
    const on=t0+i*.07, f=prog(t,on,on+.05);
    const flick=(t>on&&t<on+.16)?(.35+.65*((Math.sin((t-on)*140+i)*.5+.5)>.4?1:0)):1;
    lightBar(W/2-w/2,y,w,th,a*f*flick);
  }
}
// light-bar wipe: bright bar travels down; returns y of the bar (above = new shot)
function wipeY(t,t0,dur=.28){return lerp(-40,H+40,eIO(prog(t,t0,t0+dur)))}

// ---------- shots ----------
// [key, t0, t1, opts]
const PRESETS=[
  {k:'07',t0:4.4, label:'2× 808',   o:{cx0:960,cy0:820,z0:1.04,z1:1.12,dx:0}},
  {k:'11',t0:5.44,label:'3× kick',  o:{cx0:1080,cy0:1250,z0:1.1,z1:1.02}},
  {k:'08',t0:6.48,label:'6× master',o:{cx0:860,cy0:900,cx1:1060,z0:1.05,z1:1.1}},
  {k:'09',t0:7.52,label:'1× telephone',o:{cx0:900,cy0:1150,z0:1.12,z1:1.04}},
  {k:'01',t0:8.56,label:'1× sample lift',sub:'low-cut in the path',o:{cx0:960,cy0:1050,z0:1.0,z1:1.07}},
];
function scene(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // S1 0–2.2: tunnel lights switch on, "My master chain."
  if(t<2.6){
    const a=1-prog(t,2.2,2.5);
    // real tunnel render fades up under the procedural lights
    shot('03',t,0,2.5,{cx0:960,cy0:820,z0:1.12,z1:1.04,alpha:a*eOut(prog(t,.55,1.6))*.85,focus:1-eOut(prog(t,.6,1.8))});
    tunnel(t,.05,a*(1-eOut(prog(t,.9,1.8))*.85));
    ktext('My master chain.',W/2,H*.86,92,t,.75,2.0);
  }

  // S2 2.2–4.4: wipe to tunnel+plugin (04), then wipe to straight top view
  if(t>=2.15&&t<4.75){
    const y1=wipeY(t,2.2);
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,y1);ctx.clip();
    shot('04',t,2.2,3.4,{cx0:960,cy0:820,z0:1.0,z1:1.12,focus:1-eOut(prog(t,2.3,3.0))});
    ctx.restore();
    if(t>=3.3){const y2=wipeY(t,3.3);ctx.save();ctx.beginPath();ctx.rect(0,0,W,y2);ctx.clip();
      shot('top',t,3.3,4.5,{cx0:960,cy0:540,z0:1.14,z1:1.0});ctx.restore();lightBar(0,y2,W,4,t<3.6?1:0);}
    lightBar(0,y1,W,4,t<2.5?1:0);
  }

  // S3 4.4–9.6: one macro per preset group, whip cuts, UI-style label frame
  PRESETS.forEach((s,i)=>{
    const t1=(PRESETS[i+1]?.t0??9.6);
    if(t<s.t0-.09||t>t1+.09)return;
    // whip: incoming slides from the right over 0.18s, outgoing leaves to the left
    const inP=eOut(prog(t,s.t0-.09,s.t0+.09)), outP=eIn(prog(t,t1-.09,t1+.09));
    const dx=(1-inP)*W*.6-outP*W*.6;
    shot(s.k,t,s.t0,t1,{...s.o,dx,bright:.82});
    // vignette for label legibility
    const g=ctx.createLinearGradient(0,H*.55,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const lx=150, ly=H-250, fw=s.sub?520:400;
    frame(lx,ly,fw,s.sub?150:110,t,s.t0+.05,t1-.2,{tab:true});
    ktext(s.label,lx+42,ly+80,66,t,s.t0+.12,t1-.2,{align:'left',weight:500,track:.02});
    if(s.sub)ktext(s.sub,lx+44,ly+124,30,t,s.t0+.3,t1-.2,{align:'left',weight:400,color:GREY,track:.06});
  });
  // running tally, top-right (counts the presets shown so far: 2, 5, 11, 12, 13)
  {const tally=[2,5,11,12,13];let n=0;PRESETS.forEach((s,i)=>{if(t>=s.t0+.12)n=tally[i]});
   if(t>=4.5&&t<9.6){ctx.save();ctx.globalAlpha=prog(t,4.5,4.8)*(1-prog(t,9.4,9.6));ctx.font='400 34px BC';ctx.letterSpacing='6px';ctx.textAlign='right';ctx.fillStyle=WHITE;
     ctx.fillText(`${String(n).padStart(2,'0')} / 13`,W-150,190);ctx.restore();}}

  // S4 9.6–11.2: "13 factory presets." inside a drawn frame
  if(t>=9.5&&t<11.5){
    tunnel(t,9.55,.22*(1-prog(t,11.0,11.3)),H*.1);
    frame(W/2-300,H/2-250,600,470,t,9.6,11.0,{tab:true,dur:.7});
    ktext('13',W/2,H/2+70,300,t,9.7,11.0,{weight:300,track:-.01,inDur:.7});
    ktext('factory presets.',W/2,H/2+140,54,t,9.95,11.0,{weight:400,color:GREY,track:.04});
  }

  // S5 11.2–13.0: facts over the front macro (06), frames like AURA's knob groups
  if(t>=11.1&&t<13.2){
    const a=prog(t,11.1,11.35)*(1-prog(t,12.9,13.15));
    shot('06',t,11.1,13.2,{cx0:960,cy0:1050,z0:1.15,z1:1.08,alpha:a,bright:.38,focus:.75});
    const facts=['VST3 · AU','macOS & Windows','Lifetime updates'];const bw=440,gap=40,x0=W/2-(bw*3+gap*2)/2;
    facts.forEach((f,i)=>{const t0=11.3+i*.2;frame(x0+i*(bw+gap),H/2-70,bw,140,t,t0,12.85,{tab:i===0});
      ktext(f,x0+i*(bw+gap)+bw/2,H/2+20,56,t,t0+.15,12.85,{weight:500});});
  }

  // S6 13.0–14.8: credits, revealed by a vertical light scan over the light-bar macro (10)
  if(t>=12.95&&t<15.0){
    const a=prog(t,12.95,13.2)*(1-prog(t,14.6,14.85));
    shot('10',t,12.95,15,{cx0:900,cy0:700,z0:1.1,z1:1.02,alpha:a,bright:.35,focus:.5});
    ktext('stxrm808 credits',W/2,H/2-60,32,t,13.05,14.5,{weight:400,color:GREY,track:.3});
    const sx=lerp(W*.15,W*.85,eIO(prog(t,13.2,13.9)));
    ctx.save();ctx.beginPath();ctx.rect(0,0,sx,H);ctx.clip();
    ktext('Haftbefehl  ·  Mero  ·  Yakary  ·  Marlo',W/2,H/2+50,76,t,13.15,14.5,{weight:500,inDur:.3,trackIn:.06});
    ctx.restore();
    if(t>13.2&&t<13.95){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(sx,H/2);ctx.rotate(Math.PI/2);ctx.drawImage(BAR,-160,-24,320,48);ctx.restore();}
  }

  // S7 14.8–16.2: "Now yours." with a single light bar above
  if(t>=14.8&&t<16.4){
    lightBar(W/2-lerp(0,520,eOut(prog(t,14.8,15.4))),H/2-150,lerp(0,1040,eOut(prog(t,14.8,15.4))),3,1-prog(t,15.95,16.25));
    ktext('Now yours.',W/2,H/2+60,170,t,14.95,15.95,{weight:500});
  }

  // S8 16.2–18.2: AURA logo cascades in row by row, then URL / version / price
  if(t>=16.2&&t<18.4){
    const L=IMG.logo,rows=[[0,833],[833,1838],[1838,2844],[2844,3701]],lh=430,sc=lh/L.height,lw=L.width*sc,lx=W/2-lw/2,ly=H/2-330;
    const q=prog(t,18.0,18.25);
    rows.forEach(([a,b],i)=>{const p=eOut(prog(t,16.25+i*.11,16.25+i*.11+.45));if(p<=0)return;
      ctx.save();ctx.globalAlpha=p*(1-q);ctx.beginPath();ctx.rect(lx-20,ly+a*sc,lw+40,(b-a)*sc);ctx.clip();
      ctx.drawImage(L,0,a,L.width,b-a,lx,ly+a*sc+(1-p)*(b-a)*sc,lw,(b-a)*sc);ctx.restore();});
    ktext('flamesbounce.com',W/2,H/2+220,64,t,16.75,18.0,{weight:500});
    {const p=eOut(prog(t,17.0,17.5));if(p>0){ctx.save();ctx.globalAlpha=p*(1-q);ctx.font='400 32px BC';ctx.letterSpacing='4px';
      const a='AURA 2.2.0',b='34,99 €',wa=ctx.measureText(a).width+52,wb=ctx.measureText(b).width,tot=wa+36+wb,x0=W/2-tot/2,y0=H/2+262;
      ctx.restore();frame(x0,y0,wa,56,t,17.0,18.0,{dur:.4,alpha:1});
      ctx.save();ctx.globalAlpha=p*(1-q);ctx.font='400 32px BC';ctx.letterSpacing='4px';ctx.textBaseline='middle';ctx.fillStyle=WHITE;ctx.fillText(a,x0+26,y0+30);ctx.fillStyle=GREY;ctx.fillText(b,x0+wa+36,y0+30);ctx.restore();}}
    // DNA logo, small, top-right corner of the lock-up
    {const p=eOut(prog(t,17.2,17.6));if(p>0){const D=IMG.dna,dh=34,dw=D.width*dh/D.height;ctx.save();ctx.globalAlpha=p*(1-q)*.8;ctx.drawImage(D,W/2-dw/2,H/2+372,dw,dh);ctx.restore();}}
  }

  // S9 18.2–20.2: end card stand-in
  if(t>=18.3){
    ktext('made by',W/2,H/2-40,34,t,18.4,null,{weight:400,color:GREY,track:.3});
    ktext('riccardo bosso',W/2,H/2+60,96,t,18.6,null,{weight:500});
    lightBar(W/2-260,H/2+110,520*eOut(prog(t,18.8,19.5)),2,.6);
  }
  const fo=prog(t,DUR-.4,DUR);if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H);}
}

// ---------- grain + vignette ----------
const GRAIN=Array.from({length:6},(_,k)=>{const g=new OffscreenCanvas(256,256),c=g.getContext('2d'),d=c.createImageData(256,256),r=rng(100+k);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}c.putImageData(d,0,0);return g});
const VIG=(()=>{const c=new OffscreenCanvas(W,H),x=c.getContext('2d'),g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=g;x.fillRect(0,0,W,H);return c})();

const SUB=6,SHUTTER=.75/FPS;
window.renderFrame=function(frame){
  const t=frame/FPS;
  out.globalAlpha=1;out.fillStyle='#000';out.fillRect(0,0,W,H);
  for(let k=0;k<SUB;k++){const tk=Math.max(0,t+(k/(SUB-1)-.5)*SHUTTER);ctx.save();scene(tk);ctx.restore();out.globalAlpha=1/(k+1);out.drawImage(off,0,0);}
  out.globalAlpha=1;out.drawImage(VIG,0,0);
  out.globalAlpha=.05;out.globalCompositeOperation='overlay';out.fillStyle=out.createPattern(GRAIN[frame%6],'repeat');out.fillRect(0,0,W,H);
  out.globalCompositeOperation='source-over';out.globalAlpha=1;return true;
};
window.ready=(async()=>{await Promise.all(['300 20px BC','400 20px BC','500 20px BC'].map(f=>document.fonts.load(f)));await loadAll();return true})();
window.META={W,H,FPS,DUR};
</script></body></html>
