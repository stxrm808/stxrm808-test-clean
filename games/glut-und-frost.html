<title>Doppelschlag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600&display=swap">
<style>
  :root{
    --ink:#0e0a16; --panel:#1b1428; --bone:#f7efe2; --muted:#9d8fb5;
    --ember:#ff6a2a; --mint:#2fe0c0; --gold:#ffd24a; --danger:#ff3b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--ink)}
  body{font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--bone);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .menu{position:absolute;z-index:5;width:24px;height:24px;border:0;border-radius:50%;
    background:rgba(247,239,226,.09);color:var(--bone);font-size:11px;line-height:1;cursor:pointer;
    display:grid;place-items:center;font-family:"Outfit",sans-serif}
  #menuTop{top:3px;left:4px} #menuBot{bottom:3px;right:4px}
  .menu:active{transform:scale(.92)}
  .menu:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

  #overlay{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
    background:radial-gradient(120% 42% at 50% 0%,rgba(47,224,192,.16),transparent 62%),
               radial-gradient(120% 42% at 50% 100%,rgba(255,106,42,.18),transparent 62%),
               rgba(9,6,14,.94);
    overscroll-behavior:contain;touch-action:pan-y}
  #overlay[hidden]{display:none}
  .half{height:50%;min-height:0;display:grid;place-items:center;overflow:hidden;
    padding-block:10px;padding-left:18px;padding-right:18px}
  .half.flip{transform:rotate(180deg)}
  .card{width:100%;max-width:410px;display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center}
  .eyebrow{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted);margin:0}
  h1.title{font-family:"Bungee",Impact,sans-serif;font-size:clamp(24px,8.4vw,36px);line-height:.92;margin:0;
    letter-spacing:-.01em;
    background:linear-gradient(96deg,var(--mint) 8%,var(--bone) 46%,var(--ember) 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h2.sub{font-family:"Bungee",Impact,sans-serif;font-size:clamp(18px,5.8vw,25px);line-height:1.04;margin:0;
    text-wrap:balance}
  p.lede{margin:0;font-size:13px;line-height:1.42;font-weight:300;color:#e7ddef;max-width:33ch}
  .legend{display:flex;flex-direction:column;gap:8px;width:100%;max-width:350px}
  .leg{display:flex;gap:10px;align-items:center;text-align:left;font-size:12px;line-height:1.3;
    font-weight:300;color:#ded2e8}
  .leg b{font-weight:600;color:var(--bone)}
  .pip{flex:0 0 auto;width:40px;height:26px;border-radius:4px;display:grid;place-items:center;
    font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.04em}
  .pip.m{background:var(--mint);color:#06231d}
  .pip.e{background:var(--ember);color:#2a0c00}
  .pip.n{background:#6b5a8a;color:#f7efe2}
  .pip.k{background:transparent;box-shadow:inset 0 0 0 2px rgba(247,239,226,.34);color:var(--bone)}
  .stats{display:flex;gap:20px;font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .stats b{display:block;font-size:18px;color:var(--bone);font-weight:500;margin-top:3px}
  .stats .hi{color:var(--gold)}
  .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  button.big{font-family:"Bungee",Impact,sans-serif;font-size:14px;border:0;border-radius:999px;
    padding:12px 26px;cursor:pointer;color:#1a0d05;
    background:linear-gradient(96deg,var(--ember),var(--gold))}
  button.gh{font-family:"Outfit",sans-serif;font-weight:600;font-size:13px;border:0;border-radius:999px;
    padding:12px 18px;cursor:pointer;background:transparent;color:var(--bone);
    box-shadow:inset 0 0 0 1.5px rgba(247,239,226,.3)}
  button.big:active,button.gh:active{transform:scale(.96)}
  button.big:focus-visible,button.gh:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
  .note{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.05em;color:var(--muted);margin:0;max-width:33ch}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="game"></canvas>
  <button class="menu" id="menuTop" aria-label="Pause">☰</button>
  <button class="menu" id="menuBot" aria-label="Pause">☰</button>
  <div id="overlay">
    <div class="half flip"><div class="card" id="cardTop"></div></div>
    <div class="half"><div class="card" id="cardBot"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   DOPPELSCHLAG - ein Handy, zwei Enden, ein Ball.
   Oben (Kamera-Ende) spielt FROST, unten (Mikro-Ende) GLUT.
   Der Ball trägt die Farbe des Schlägers, der ihn zuletzt getroffen hat -
   und farbige Kerne zerspringen nur in ihrer eigenen Farbe. Also: zuspielen.
   ===================================================================== */

var cv = document.getElementById('game'), ctx = cv.getContext('2d');
var overlay = document.getElementById('overlay');
var cardTop = document.getElementById('cardTop'), cardBot = document.getElementById('cardBot');

var W = 0, H = 0, dpr = 1;
var HUD = 28, MISS = 56, PADH = 12;
var COLS = 7, BGAP = 5, BH = 22;
var padY = [0, 0], lossY = [0, 0];

var MINT = '#2fe0c0', EMBER = '#ff6a2a', NEUT = '#6b5a8a', BOLT = '#fff6dd';
var COL = [MINT, EMBER, BOLT];
var COL_DARK = ['#0c3f38', '#4a1c08', '#3a3450'];

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function rnd(a, b){ return a + Math.random() * (b - a); }

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lossY = [HUD, H - HUD];
  padY = [HUD + MISS, H - HUD - MISS];
  COLS = clamp(Math.round(W / 56), 5, 9);
  if (G.blocks.length) layoutBlocks();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

/* ---------------------------------------------------- Ton --------- */
var AC = null, muted = false;
function audio(){ if (!AC){ var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, vol, to){
  if (muted) return; var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, a.currentTime);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), a.currentTime + d);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, a.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02);
}
var SFX = {
  pad:   function(i){ tone(i ? 300 : 420, 0.07, 'square', 0.05, i ? 420 : 600); },
  wall:  function(){ tone(700, 0.03, 'square', 0.025); },
  brk:   function(n){ tone(380 + Math.min(n, 14) * 48, 0.09, 'triangle', 0.05, 180 + n * 30); },
  clang: function(){ tone(140, 0.13, 'sawtooth', 0.045, 90); },
  drop:  function(){ [740, 990, 1320].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.1, 'triangle', 0.05); }, i * 60); }); },
  dead:  function(){ tone(260, 0.4, 'sawtooth', 0.07, 50); },
  wave:  function(){ [523, 659, 784, 1046].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.2, 'triangle', 0.06); }, i * 100); }); },
  over:  function(){ [440, 350, 262, 175].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.3, 'sawtooth', 0.055); }, i * 150); }); },
  serve: function(){ tone(880, 0.12, 'triangle', 0.05, 1200); }
};

/* ---------------------------------------------------- Zustand ----- */
var G = {
  phase: 'intro', score: 0, best: 0, lives: 3, wave: 1, combo: 0, bestCombo: 0,
  balls: [], blocks: [], drops: [], bits: [], pops: [], texts: [],
  pads: [ { x: 0, tx: 0, w: 82, flash: 0, wide: 0 }, { x: 0, tx: 0, w: 82, flash: 0, wide: 0 } ],
  shake: 0, slow: 0, serve: 0, flash: 0, flashSide: -1, rows: 4, seed: 1, t: 0, cleared: 0
};
try { G.best = parseInt(localStorage.getItem('ds_best') || '0', 10) || 0; } catch (e) {}
function saveBest(){ try { localStorage.setItem('ds_best', String(G.best)); } catch (e) {} }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------------------------------------------- Wellen ------ */
function buildWave(n){
  var r = mulberry32(n * 2654435761 % 2147483647);
  var rows = n < 3 ? 4 : n < 6 ? 6 : 8;   // immer gerade: zwei gleich große Nester
  var pats = ['rows', 'checker', 'cores', 'pyramid', 'columns', 'ring'];
  var pat = pats[(n - 1) % pats.length];
  var coreShare = clamp(0.14 + n * 0.025, 0.14, 0.32);
  var armour = n >= 4 ? clamp(0.08 + n * 0.02, 0.08, 0.3) : 0;
  var out = [];
  for (var ry = 0; ry < rows; ry++){
    for (var cx = 0; cx < COLS; cx++){
      var c = 2, skip = false;
      if (pat === 'rows') c = ry % 3 === 0 ? 0 : ry % 3 === 1 ? 2 : 1;
      else if (pat === 'checker') c = (ry + cx) % 2 ? ((ry % 2) ? 0 : 1) : 2;
      else if (pat === 'cores') c = r() < coreShare ? (r() < 0.5 ? 0 : 1) : 2;
      else if (pat === 'pyramid'){
        var pad = Math.floor((rows - 1 - ry) / 2);
        if (cx < pad || cx >= COLS - pad) skip = true;
        c = ry === rows - 1 ? 2 : (cx < COLS / 2 ? 0 : 1);
      } else if (pat === 'columns') c = cx % 3 === 0 ? 0 : cx % 3 === 1 ? 2 : 1;
      else { // ring
        var edge = ry === 0 || ry === rows - 1 || cx === 0 || cx === COLS - 1;
        if (!edge) skip = r() < 0.65;
        c = edge ? ((ry + cx) % 2 ? 0 : 1) : 2;
      }
      if (skip) continue;
      if (c !== 2 && r() > coreShare + 0.35) c = 2;
      if (c !== 2) c = ry < rows / 2 ? 1 : 0;   // oben Glut-Kerne, unten Frost-Kerne
      var hp = (c === 2 && r() < armour) ? 2 : 1;
      out.push({ cx: cx, ry: ry, c: c, hp: hp, max: hp, x: 0, y: 0, w: 0, h: BH, hit: 0 });
    }
  }
  G.rows = rows; G.blocks = out; layoutBlocks();
}

function layoutBlocks(){
  var m = 13, bw = (W - m * 2 - (COLS - 1) * BGAP) / COLS;
  var half = G.rows / 2, clusterH = half * (BH + BGAP) - BGAP;
  var nestY = [H * 0.33 - clusterH / 2, H * 0.67 - clusterH / 2];
  for (var i = 0; i < G.blocks.length; i++){
    var b = G.blocks[i], nest = b.ry < half ? 0 : 1;
    b.w = bw; b.x = m + b.cx * (bw + BGAP);
    b.y = nestY[nest] + (b.ry - nest * half) * (BH + BGAP);
  }
}

/* ---------------------------------------------------- Bälle ------- */
function baseSpeed(){ return Math.min(470 + (G.wave - 1) * 28, 880); }
function newBall(c, dir){
  var sp = baseSpeed(), ang = rnd(-0.5, 0.5);
  return { x: W / 2, y: H / 2, vx: Math.sin(ang) * sp, vy: Math.cos(ang) * sp * dir,
           r: 7, c: c === undefined ? (Math.random() < 0.5 ? 0 : 1) : c, bolt: 0, tr: [] };
}
function serve(){ G.serve = 0.85; SFX.serve(); }
function speedOf(b){ return Math.hypot(b.vx, b.vy); }
function setSpeed(b, s){ var m = speedOf(b) || 1; b.vx = b.vx / m * s; b.vy = b.vy / m * s; }

function startGame(){
  G.score = 0; G.lives = 3; G.wave = 1; G.combo = 0; G.bestCombo = 0; G.cleared = 0;
  G.balls = []; G.drops = []; G.bits = []; G.pops = []; G.texts = [];
  G.pads[0].w = G.pads[1].w = 82; G.pads[0].wide = G.pads[1].wide = 0;
  G.pads[0].x = G.pads[0].tx = G.pads[1].x = G.pads[1].tx = W / 2;
  buildWave(1); serve(); G.phase = 'play'; hide();
}

/* ---------------------------------------------------- Effekte ----- */
function burst(x, y, col, n){
  for (var i = 0; i < n; i++) G.bits.push({ x: x, y: y, vx: rnd(-200, 200), vy: rnd(-200, 200),
    life: rnd(0.28, 0.6), col: col, s: rnd(2, 4.5) });
}
function pop(x, y, w, h, col){ G.pops.push({ x: x, y: y, w: w, h: h, col: col, t: 0 }); }
function floatText(x, y, s, col, both){ G.texts.push({ x: x, y: y, s: s, col: col, t: 0, both: !!both }); }

/* ---------------------------------------------------- Logik ------- */
function breakBlock(b, ball, idx){
  b.hp--;
  if (b.hp > 0){ b.hit = 1; SFX.clang(); return; }
  G.blocks.splice(idx, 1);
  G.combo++;
  if (G.combo > G.bestCombo) G.bestCombo = G.combo;
  var base = b.c === 2 ? 10 : 25;
  var pts = base * Math.max(1, G.combo);
  G.score += pts;
  burst(b.x + b.w / 2, b.y + b.h / 2, COL[b.c] || NEUT, b.c === 2 ? 7 : 11);
  pop(b.x, b.y, b.w, b.h, b.c === 2 ? NEUT : COL[b.c]);
  G.shake = Math.min(G.shake + (b.c === 2 ? 2.2 : 4), 13);
  SFX.brk(G.combo);
  if (G.combo >= 3) floatText(b.x + b.w / 2, b.y, '×' + G.combo, G.combo >= 8 ? '#ffd24a' : '#f7efe2');
  if (Math.random() < 0.11) dropPower(b.x + b.w / 2, b.y + b.h / 2);
  if (!G.blocks.length) clearWave();
}
function dropPower(x, y){
  var kinds = ['wide', 'multi', 'slow', 'bolt', 'wide', 'multi', 'bolt', 'heart'];
  var k = kinds[(Math.random() * kinds.length) | 0];
  if (k === 'heart' && G.lives >= 5) k = 'slow';
  G.drops.push({ x: x, y: y, vy: (Math.random() < 0.5 ? -1 : 1) * 135, k: k, t: 0 });
}
function grab(d, side){
  SFX.drop();
  var p = G.pads[side];
  if (d.k === 'wide'){ p.wide = 9; p.w = 126; floatText(p.x, padY[side], 'BREIT', COL[side]); }
  else if (d.k === 'multi'){
    var src = G.balls[0];
    for (var i = 0; i < 2; i++){
      var n = newBall(src ? src.c : side, Math.random() < 0.5 ? 1 : -1);
      if (src){ n.x = src.x; n.y = src.y; var a = rnd(-1, 1); var s = speedOf(src);
        n.vx = Math.sin(a) * s; n.vy = Math.cos(a) * s * (Math.random() < 0.5 ? 1 : -1); }
      G.balls.push(n);
    }
    floatText(p.x, padY[side], 'MULTI', COL[side]);
  }
  else if (d.k === 'slow'){ G.slow = 5; floatText(p.x, padY[side], 'LANGSAM', COL[side]); }
  else if (d.k === 'bolt'){ for (var b = 0; b < G.balls.length; b++){ G.balls[b].bolt = 6; G.balls[b].c = 2; }
    floatText(p.x, padY[side], 'BLITZ', BOLT); }
  else { G.lives = Math.min(5, G.lives + 1); floatText(p.x, padY[side], '+♥', '#ff3b6b'); }
}
function clearWave(){
  G.slow = Math.max(G.slow, 0.7);
  var bonus = 100 * G.wave + 25 * G.lives;
  G.score += bonus; G.cleared++;
  floatText(W / 2, H / 2, 'WELLE ' + G.wave + '  +' + bonus, '#ffd24a', true);
  G.shake = 12; SFX.wave();
  G.wave++;
  setTimeout(function(){
    if (G.phase !== 'play') return;
    G.balls = []; G.drops = []; buildWave(G.wave); serve();
  }, 900);
}
function loseLife(side){
  G.lives--; G.combo = 0; G.shake = 20; G.flash = 0.4; G.flashSide = side; SFX.dead();
  if (G.lives <= 0){ gameOver(); return; }
  serve();
}
function gameOver(){
  G.phase = 'over';
  if (G.score > G.best){ G.best = G.score; saveBest(); }
  SFX.over(); cardOver();
}

function stepBall(b, dt){
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.bolt > 0){ b.bolt -= dt; if (b.bolt <= 0) b.c = Math.random() < 0.5 ? 0 : 1; }

  if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); SFX.wall(); }
  if (b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); SFX.wall(); }

  for (var s = 0; s < 2; s++){
    var p = G.pads[s], py = padY[s];
    var top = py - PADH / 2, bot = py + PADH / 2;
    if (b.y + b.r > top && b.y - b.r < bot && b.x > p.x - p.w / 2 - b.r && b.x < p.x + p.w / 2 + b.r){
      var goingInto = s === 0 ? b.vy < 0 : b.vy > 0;
      if (goingInto){
        b.y = s === 0 ? bot + b.r : top - b.r;
        var off = clamp((b.x - p.x) / (p.w / 2), -1, 1);
        var sp = Math.min(speedOf(b) + 9, 920);
        b.vx = off * sp * 0.72;
        b.vy = (s === 0 ? 1 : -1) * Math.sqrt(Math.max(sp * sp - b.vx * b.vx, sp * sp * 0.16));
        if (b.bolt <= 0) b.c = s;
        p.flash = 1; G.combo = 0; SFX.pad(s);
        burst(b.x, py, COL[s], 4);
      }
    }
  }

  for (var i = G.blocks.length - 1; i >= 0; i--){
    var k = G.blocks[i];
    var nx = clamp(b.x, k.x, k.x + k.w), ny = clamp(b.y, k.y, k.y + k.h);
    var dx = b.x - nx, dy = b.y - ny;
    if (dx * dx + dy * dy > b.r * b.r) continue;
    var ox = (k.w / 2 + b.r) - Math.abs(b.x - (k.x + k.w / 2));
    var oy = (k.h / 2 + b.r) - Math.abs(b.y - (k.y + k.h / 2));
    if (ox < oy){ b.vx = -b.vx; b.x += b.vx > 0 ? ox : -ox; }
    else { b.vy = -b.vy; b.y += b.vy > 0 ? oy : -oy; }
    var can = k.c === 2 || b.c === 2 || k.c === b.c || G.blocks.length <= 3;
    if (can) breakBlock(k, b, i);
    else { k.hit = 1; SFX.clang(); G.shake = Math.min(G.shake + 1.6, 10);
      burst(b.x, b.y, '#f7efe2', 3); }
    break;
  }

  // zu flach? dann wieder Richtung Schläger drücken
  var sp2 = speedOf(b);
  if (Math.abs(b.vy) < sp2 * 0.34){ b.vy = (b.vy < 0 ? -1 : 1) * sp2 * 0.34; setSpeed(b, sp2); }

  b.tr.push(b.x, b.y); if (b.tr.length > 22) b.tr.splice(0, 2);
  return b.y > lossY[0] - 60 && b.y < lossY[1] + 60;
}

function update(dt){
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 42);
  if (G.flash > 0) G.flash -= dt;
  for (var s = 0; s < 2; s++){
    var p = G.pads[s];
    p.x += (p.tx - p.x) * Math.min(1, dt * 24);
    p.x = clamp(p.x, p.w / 2 + 4, W - p.w / 2 - 4);
    if (p.flash > 0) p.flash -= dt * 5;
    if (p.wide > 0){ p.wide -= dt; if (p.wide <= 0) p.w = 82; }
  }
  if (G.slow > 0) G.slow -= dt;

  if (G.serve > 0){
    G.serve -= dt;
    if (G.serve <= 0){
      var count = clamp(1 + Math.floor((G.wave - 1) / 3), 1, 3);
      for (var v = 0; v < count; v++){
        var nb = newBall(v % 2, v % 2 ? 1 : -1);
        nb.vx = Math.sin(rnd(-0.7, 0.7) + v) * baseSpeed(); 
        nb.vy = Math.sign(nb.vy || 1) * Math.sqrt(Math.max(baseSpeed() * baseSpeed() - nb.vx * nb.vx, 1));
        G.balls.push(nb);
      }
    }
  }

  // Endspiel: die letzten Steine sollen kein Gefummel sein
  if (G.blocks.length > 0 && G.blocks.length <= 3){
    for (var m = 0; m < G.balls.length; m++){
      var bb = G.balls[m], tg = null, td = 1e9;
      for (var k2 = 0; k2 < G.blocks.length; k2++){
        var kb = G.blocks[k2], ddx = kb.x + kb.w / 2 - bb.x, ddy = kb.y + kb.h / 2 - bb.y;
        var dd = ddx * ddx + ddy * ddy; if (dd < td){ td = dd; tg = kb; }
      }
      if (tg){
        var sp3 = speedOf(bb);
        bb.vx += (tg.x + tg.w / 2 - bb.x) * dt * 1.6;
        bb.vy += (tg.y + tg.h / 2 - bb.y) * dt * 1.6;
        setSpeed(bb, sp3);
      }
    }
  }

  var bdt = dt * (G.slow > 0 ? 0.45 : 1);
  for (var i = G.balls.length - 1; i >= 0; i--){
    var b = G.balls[i], steps = Math.ceil(speedOf(b) * bdt / 6), alive = true;
    for (var n = 0; n < steps; n++){ alive = stepBall(b, bdt / steps); if (!alive) break; }
    if (!alive){
      var side = b.y < H / 2 ? 0 : 1;
      burst(b.x, side === 0 ? lossY[0] : lossY[1], COL[b.c] || BOLT, 14);
      G.balls.splice(i, 1);
      if (!G.balls.length && G.serve <= 0 && G.blocks.length) loseLife(side);
    }
  }

  for (var d = G.drops.length - 1; d >= 0; d--){
    var dr = G.drops[d]; dr.y += dr.vy * dt; dr.t += dt;
    var side = dr.vy > 0 ? 1 : 0, p2 = G.pads[side];
    if (Math.abs(dr.y - padY[side]) < 13 && Math.abs(dr.x - p2.x) < p2.w / 2 + 11){ grab(dr, side); G.drops.splice(d, 1); continue; }
    if (dr.y < -20 || dr.y > H + 20) G.drops.splice(d, 1);
  }
  for (var q = G.bits.length - 1; q >= 0; q--){
    var bt = G.bits[q]; bt.life -= dt; bt.x += bt.vx * dt; bt.y += bt.vy * dt; bt.vy += 380 * dt;
    if (bt.life <= 0) G.bits.splice(q, 1);
  }
  for (var o = G.pops.length - 1; o >= 0; o--){ G.pops[o].t += dt * 6; if (G.pops[o].t >= 1) G.pops.splice(o, 1); }
  for (var x = G.texts.length - 1; x >= 0; x--){ G.texts[x].t += dt * 1.5; if (G.texts[x].t >= 1) G.texts.splice(x, 1); }
  for (var y = 0; y < G.blocks.length; y++) if (G.blocks[y].hit > 0) G.blocks[y].hit -= dt * 4;
}

/* ---------------------------------------------------- Bild -------- */
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function heart(x, y, s, fill){
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.85);
  ctx.bezierCurveTo(x - s * 1.3, y - s * 0.15, x - s * 0.45, y - s * 0.95, x, y - s * 0.25);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 0.95, x + s * 1.3, y - s * 0.15, x, y + s * 0.85);
  ctx.closePath(); ctx.fill();
}

function nearest(side){            // wie nah ist der nächste Ball an dieser Kante?
  var best = 1e9, col = null;
  for (var i = 0; i < G.balls.length; i++){
    var b = G.balls[i];
    var d = side === 0 ? b.y - lossY[0] : lossY[1] - b.y;
    var toward = side === 0 ? b.vy < 0 : b.vy > 0;
    if (toward && d < best){ best = d; col = COL[b.c]; }
  }
  return { d: best, col: col };
}

function drawRail(side){
  // Das Glühen bleibt im Bildschirmraum - es soll ins Feld bluten.
  var innerY = side === 0 ? HUD : H - HUD;
  var n = nearest(side), glow = n.col ? clamp(1 - n.d / (H * 0.55), 0, 1) : 0;
  if (glow > 0.02){
    var far = side === 0 ? innerY + HUD * 2.6 : innerY - HUD * 2.6;
    var gr = ctx.createLinearGradient(0, innerY, 0, far);
    gr.addColorStop(0, n.col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = glow * 0.5; ctx.fillStyle = gr;
    ctx.fillRect(0, Math.min(innerY, far), W, HUD * 2.6); ctx.globalAlpha = 1;
  }

  // Die obere Leiste wird um 180° gedreht: wer am Kamera-Ende sitzt, liest sie richtig herum.
  ctx.save();
  if (side === 0){ ctx.translate(W / 2, HUD / 2); ctx.rotate(Math.PI); ctx.translate(-W / 2, -HUD / 2); }
  else ctx.translate(0, H - HUD);
  // lokal: (0,0)-(W,HUD), y = 0 ist die Verlustlinie, y = HUD die Handykante
  ctx.fillStyle = '#120c1d'; ctx.fillRect(0, 0, W, HUD);
  ctx.fillStyle = side === 0 ? MINT : EMBER; ctx.globalAlpha = .5;
  ctx.fillRect(0, 0, W, 2); ctx.globalAlpha = 1;

  var cy = HUD / 2;
  for (var i = 0; i < 5; i++){
    var on = i < G.lives;
    ctx.globalAlpha = on ? 1 : 0.16;
    heart(13 + i * 16, cy, 5.6, on ? '#ff3b6b' : '#f7efe2');
  }
  ctx.globalAlpha = 1;
  ctx.font = '500 13px "DM Mono", ui-monospace, monospace';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = '#f7efe2'; ctx.fillText(String(G.score), W / 2, cy + 1);
  ctx.font = '400 10px "DM Mono", ui-monospace, monospace';
  ctx.fillStyle = '#9d8fb5'; ctx.textAlign = 'right';
  ctx.fillText('W' + G.wave, W - 32, cy + 1);
  ctx.restore();
}

function blurb(tx, flip, off){
  var d = tx.t * 34;
  ctx.save();
  ctx.translate(tx.x, flip ? tx.y + d + off : tx.y - d - off);
  if (flip) ctx.rotate(Math.PI);
  ctx.fillText(tx.s, 0, 0);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake) * .5, rnd(-G.shake, G.shake) * .5);

  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d1620'); bg.addColorStop(0.5, '#120c1c'); bg.addColorStop(1, '#1d0f16');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);

  // Mittellinie als ruhiger Anker hinter dem Feld
  ctx.strokeStyle = 'rgba(247,239,226,.06)'; ctx.lineWidth = 1; ctx.setLineDash([5, 9]);
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);

  // Fehlzonen hinter den Schlägern
  for (var s = 0; s < 2; s++){
    var g2 = ctx.createLinearGradient(0, lossY[s], 0, padY[s]);
    g2.addColorStop(0, s === 0 ? 'rgba(47,224,192,.10)' : 'rgba(255,106,42,.10)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, Math.min(lossY[s], padY[s]), W, Math.abs(padY[s] - lossY[s]));
  }

  for (var i = 0; i < G.blocks.length; i++){
    var b = G.blocks[i], col = b.c === 2 ? NEUT : COL[b.c];
    ctx.fillStyle = COL_DARK[b.c === 2 ? 2 : b.c];
    rr(b.x, b.y + 3, b.w, b.h, 4); ctx.fill();
    ctx.fillStyle = col; rr(b.x, b.y, b.w, b.h - 1, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(b.x + 3, b.y + 3, b.w - 6, 4, 2); ctx.fill();
    if (b.c !== 2){                                   // Kern: nur in seiner Farbe zu knacken
      ctx.strokeStyle = 'rgba(10,7,16,.55)'; ctx.lineWidth = 2;
      var mx = b.x + b.w / 2, my = b.y + b.h / 2;
      ctx.beginPath(); ctx.moveTo(mx - 6, my); ctx.lineTo(mx, my - 5);
      ctx.lineTo(mx + 6, my); ctx.lineTo(mx, my + 5); ctx.closePath(); ctx.stroke();
    } else if (b.max > 1){                            // gepanzert
      ctx.strokeStyle = 'rgba(247,239,226,.55)'; ctx.lineWidth = 1.5;
      rr(b.x + 3.5, b.y + 3.5, b.w - 7, b.h - 8, 2); ctx.stroke();
    }
    if (G.blocks.length <= 3){
      ctx.globalAlpha = .5 + Math.sin(G.t * 9) * .35; ctx.strokeStyle = '#f7efe2'; ctx.lineWidth = 2;
      rr(b.x - 2, b.y - 2, b.w + 4, b.h + 3, 6); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (b.hit > 0){ ctx.globalAlpha = b.hit * .85; ctx.fillStyle = '#fff';
      rr(b.x, b.y, b.w, b.h - 1, 4); ctx.fill(); ctx.globalAlpha = 1; }
  }

  for (var p = 0; p < G.pops.length; p++){
    var o = G.pops[p], e = o.t, gr2 = 1 + e * 1.1;
    ctx.globalAlpha = (1 - e) * .8; ctx.strokeStyle = o.col; ctx.lineWidth = 2.5;
    rr(o.x + o.w / 2 - o.w * gr2 / 2, o.y + o.h / 2 - o.h * gr2 / 2, o.w * gr2, o.h * gr2, 5);
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  for (var d = 0; d < G.drops.length; d++){
    var dr = G.drops[d], lab = { wide: '↔', multi: '＋', slow: '◷', bolt: '⚡', heart: '♥' }[dr.k];
    var col2 = dr.k === 'heart' ? '#ff3b6b' : dr.k === 'bolt' ? BOLT : '#ffd24a';
    ctx.save(); ctx.translate(dr.x, dr.y);
    ctx.rotate(Math.sin(dr.t * 4) * 0.25 + (dr.vy < 0 ? Math.PI : 0));
    ctx.fillStyle = col2; rr(-12, -11, 24, 22, 6); ctx.fill();
    ctx.fillStyle = '#150d1e'; ctx.font = '600 13px "Outfit", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(lab, 0, 1);
    ctx.restore();
  }

  for (var q = 0; q < G.bits.length; q++){
    var bt = G.bits[q]; ctx.globalAlpha = clamp(bt.life * 2.4, 0, 1);
    ctx.fillStyle = bt.col; ctx.fillRect(bt.x - bt.s / 2, bt.y - bt.s / 2, bt.s, bt.s);
  }
  ctx.globalAlpha = 1;

  for (var s2 = 0; s2 < 2; s2++){
    var pd = G.pads[s2], col3 = COL[s2], y2 = padY[s2];
    ctx.globalAlpha = .25 + Math.max(0, pd.flash) * .5; ctx.fillStyle = col3;
    rr(pd.x - pd.w / 2 - 5, y2 - PADH / 2 - 5, pd.w + 10, PADH + 10, 9); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = col3; rr(pd.x - pd.w / 2, y2 - PADH / 2, pd.w, PADH, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    rr(pd.x - pd.w / 2 + 5, y2 - PADH / 2 + 3, pd.w - 10, 3, 1.5); ctx.fill();
  }

  for (var n2 = 0; n2 < G.balls.length; n2++){
    var bl = G.balls[n2], bc = COL[bl.c] || BOLT;
    for (var t = 0; t < bl.tr.length; t += 2){
      var f = t / bl.tr.length;
      ctx.globalAlpha = f * .5; ctx.fillStyle = bc;
      ctx.beginPath(); ctx.arc(bl.tr[t], bl.tr[t + 1], bl.r * f * .9, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = .3; ctx.fillStyle = bc;
    ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r * 2.2, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = bc;
    ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc(bl.x - 2, bl.y - 2.5, bl.r * .38, 0, 6.2832); ctx.fill();
  }

  if (G.serve > 0){
    ctx.globalAlpha = .25 + Math.sin(G.t * 18) * .2; ctx.fillStyle = '#f7efe2';
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 9, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var x2 = 0; x2 < G.texts.length; x2++){
    var tx = G.texts[x2];
    ctx.globalAlpha = 1 - tx.t; ctx.fillStyle = tx.col;
    ctx.font = '600 ' + (tx.s.length > 6 ? 15 : 19) + 'px "Bungee", Impact, sans-serif';
    if (tx.both){ blurb(tx, false, 26); blurb(tx, true, 26); }
    else blurb(tx, tx.y < H / 2, 0);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawRail(0); drawRail(1);

  if (G.flash > 0){
    ctx.fillStyle = 'rgba(255,59,107,' + (G.flash * .45) + ')';
    if (G.flashSide === 0) ctx.fillRect(0, 0, W, H * .3); else ctx.fillRect(0, H * .7, W, H * .3);
  }
}

/* ---------------------------------------------------- Karten ------ */
function show(html){ cardTop.innerHTML = html; cardBot.innerHTML = html; overlay.hidden = false; }
function hide(){ overlay.hidden = true; }

function cardIntro(){
  G.phase = 'intro';
  show(
    '<p class="eyebrow">Zwei Daumen · ein Handy</p>' +
    '<h1 class="title">Doppelschlag</h1>' +
    '<p class="lede">Handy hochkant, jede Person an einem Ende. Zieh mit dem Daumen auf <b>deiner</b> Hälfte — das ist dein Schläger. Drei Herzen habt ihr zusammen.</p>' +
    '<div class="legend">' +
      '<div class="leg"><span class="pip n">■</span><span><b>Graue Steine</b> zerspringen immer.</span></div>' +
      '<div class="leg"><span class="pip m">◆</span><span><b>Kerne</b> nur in ihrer Farbe — und der Ball trägt die Farbe des Schlägers, der ihn zuletzt traf. Also zuspielen.</span></div>' +
      '<div class="leg"><span class="pip k">⚡</span><span>Fallende Symbole mit dem Schläger fangen.</span></div>' +
    '</div>' +
    '<div class="row"><button class="big" data-act="start">Anpfiff</button></div>'
  );
}
function cardOver(){
  show(
    '<p class="eyebrow">' + (G.score >= G.best && G.score > 0 ? 'Neuer Rekord' : 'Vorbei') + '</p>' +
    '<h2 class="sub">' + (G.wave > 6 ? 'Ihr seid ein Team.' : G.wave > 3 ? 'Geht noch weiter.' : 'Noch mal reden und noch mal.') + '</h2>' +
    '<div class="stats">' +
      '<span>Punkte<b>' + G.score + '</b></span>' +
      '<span>Welle<b>' + G.wave + '</b></span>' +
      '<span>Beste Kette<b>×' + G.bestCombo + '</b></span>' +
    '</div>' +
    '<p class="note">Rekord: <span style="color:var(--gold)">' + G.best + '</span></p>' +
    '<div class="row"><button class="big" data-act="start">Nochmal</button>' +
      '<button class="gh" data-act="how">Anleitung</button></div>'
  );
}
function cardPause(){
  G.phase = 'pause';
  show(
    '<p class="eyebrow">Pause</p>' +
    '<h2 class="sub">Welle ' + G.wave + '</h2>' +
    '<div class="stats"><span>Punkte<b>' + G.score + '</b></span>' +
      '<span>Herzen<b>' + G.lives + '</b></span>' +
      '<span class="hi">Rekord<b class="hi">' + G.best + '</b></span></div>' +
    '<div class="row"><button class="big" data-act="resume">Weiter</button>' +
      '<button class="gh" data-act="start">Neu</button>' +
      '<button class="gh" data-act="sound">Ton: ' + (muted ? 'aus' : 'an') + '</button></div>'
  );
}
overlay.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  audio();
  var a = b.getAttribute('data-act');
  if (a === 'start') startGame();
  else if (a === 'resume'){ hide(); G.phase = 'play'; }
  else if (a === 'how') cardIntro();
  else if (a === 'sound'){ muted = !muted; cardPause(); }
});
['menuTop', 'menuBot'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(){ audio(); if (G.phase === 'play') cardPause(); });
});

/* ---------------------------------------------------- Eingabe ----- */
var pointers = {};
function aim(e){
  var r = cv.getBoundingClientRect();
  var s = (e.clientY - r.top) < r.height / 2 ? 0 : 1;
  return { s: s, x: e.clientX - r.left };
}
cv.addEventListener('pointerdown', function(e){
  e.preventDefault(); audio();
  var a = aim(e); pointers[e.pointerId] = a.s; G.pads[a.s].tx = a.x;
}, { passive: false });
cv.addEventListener('pointermove', function(e){
  e.preventDefault();
  var s = pointers[e.pointerId]; if (s === undefined) return;
  var r = cv.getBoundingClientRect(); G.pads[s].tx = e.clientX - r.left;
}, { passive: false });
function up(e){ delete pointers[e.pointerId]; }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

var keys = {};
window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()] = 1;
  if (['arrowleft','arrowright',' '].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault(); });
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = 0; });
function keyMove(dt){
  var sp = 620 * dt;
  if (keys['a']) G.pads[0].tx -= sp; if (keys['d']) G.pads[0].tx += sp;
  if (keys['arrowleft']) G.pads[1].tx -= sp; if (keys['arrowright']) G.pads[1].tx += sp;
}

/* ---------------------------------------------------- Schleife ---- */
var last = 0, acc = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (G.phase === 'play'){
    keyMove(dt);
    acc += dt; var n = 0;
    while (acc >= 1 / 120 && n < 8){ update(1 / 120); acc -= 1 / 120; n++; }
  } else { acc = 0; G.shake = 0; }
  draw();
}

function start(saved){
  resize();
  if (saved && saved.best) G.best = Math.max(G.best, saved.best);
  buildWave(1);
  G.pads[0].x = G.pads[0].tx = G.pads[1].x = G.pads[1].tx = W / 2;
  cardIntro();
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot){
  try { window.claude.hot.snapshot(function(){ return { best: G.best }; }); } catch (err) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
